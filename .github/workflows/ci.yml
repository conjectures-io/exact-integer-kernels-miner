name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - name: Evaluator and client
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-miner.txt
      - name: Setup
        run: python -m eik setup
      - name: The template and the incumbent pass the static rules
        run: |
          python -m eik check template/entry.c
          python -m eik check examples/incumbent.c
          python miner/submit.py check template/entry.c
      - name: A slice of the full check passes (every input of 8 chunks)
        run: python -m eik fullcheck template/entry.c --function tanh --chunks 916:924
